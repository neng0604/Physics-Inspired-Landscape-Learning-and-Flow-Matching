name: static-checks

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.9"
      - name: Check Python syntax
        run: python -m compileall -q models utils datasets energy scripts
      - name: Check shell syntax
        run: find workflows -type f -name '*.sh' -print0 | xargs -0 -n1 bash -n
      - name: Check artifact manifest
        run: python -m json.tool artifacts.json >/dev/null
